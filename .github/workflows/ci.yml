name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Both embed bundles bake their target origin in at build time; a wrong
      # host ships an embed that sends every request into a black hole with no
      # error anywhere. This happened TWICE: the snippet's SERVE_BASE pointed
      # at an unregistered host for months, and the widgets bundle shipped to
      # production calling http://localhost:3001 (found 2026-08-12). Each check
      # fails when its built bundle lacks the canonical origin, carries a stray
      # absolute origin, or the host stops resolving/responding.
      - name: Verify snippet serving origin
        run: pnpm --filter @ada/snippet check:host

      - name: Verify widgets API origin
        run: pnpm --filter @ada/widgets check:host

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter=!@ada/api --filter=!@ada/firebase-tests test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: npm install -g firebase-tools

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ada/shared build

      - name: Setup Java (required for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Firestore rules tests
        run: pnpm test:rules

      - name: Run API tests with Emulator
        run: pnpm test:api
